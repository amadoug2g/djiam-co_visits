<style>
  /* écran de chargement, remplacé par l'application dès qu'elle démarre */
  html,body{margin:0;height:100%;background:#0c0c0b}
  #boot{position:fixed;inset:0;display:grid;place-content:center;gap:14px;justify-items:center;color:#9b978f;font:14px/1.4 system-ui,sans-serif}
  #boot img{width:72px;height:72px;border-radius:16px}
  #boot i{display:block;width:120px;height:2px;background:#2b2926;overflow:hidden;position:relative}
  #boot i::after{content:"";position:absolute;inset:0;width:40%;background:#c48a5c;animation:boot 1.1s ease-in-out infinite}
  @keyframes boot{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  @media (prefers-reduced-motion:reduce){#boot i::after{animation:none;width:100%}}
</style>
</head>
<body>
<div id="root"><div id="boot" role="status"><img src="./icon-192.png" alt=""><span>Villa témoin · chargement</span><i></i></div></div>
